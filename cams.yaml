# Réglages de l'analyse
settings:
  # Seules les images prises dans cette plage horaire (heure locale) sont
  # retenues pour l'indice du jour : lumière plus homogène.
  daylight_hours: [10, 15]
  timezone: Europe/Paris
  # Modèle de prévision « froid cumulé » (voir README) :
  forecast:
    start_month_day: "08-01"   # début du cumul de froid
    base_temp: 10.0            # °C : seuil de froid
    # Degrés-jours de froid au pic. Valeur indicative (pic ~20-25 oct. vers
    # 1900 m avec les températures Open-Meteo 2026) : `larch calibrate` la
    # remplace par webcam dès qu'un pic a été observé.
    peak_threshold: 45.0
