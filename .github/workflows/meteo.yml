name: Météo des mélèzes

on:
  schedule:
    # Toutes les 30 min de 8h à 13h59 UTC, de septembre à novembre. GitHub retarde
    # (parfois de plusieurs heures) ou abandonne une partie des exécutions
    # planifiées : avec de nombreux créneaux, quelques-uns tombent dans la plage
    # utile. `--daylight-only` ignore le relevé des webcams hors de la plage
    # 10h-15h (heure de Paris, settings.daylight_hours) ; le suivi Sentinel-2 et
    # la page sont mis à jour à chaque fois.
    - cron: "7,37 8-13 * 9-11 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteo-meleze
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          pip install -e '.[browser,satellite]'
          playwright install --with-deps chromium
      - name: Relevé des webcams
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        # Lancement manuel : relevé quelle que soit l'heure.
        run: larch fetch ${{ github.event_name == 'schedule' && '--daylight-only' || '' }}
      # Masques des zones suivies par satellite (recalculés une fois par an)
      - uses: actions/cache@v4
        with:
          path: .cache/satsuivi
          # Nouvelle clé à chaque exécution (les masques changent d'une année à l'autre),
          # restaurée depuis la plus récente.
          key: satsuivi-${{ hashFiles('cams.yaml', 'data/meleze_sentinel2.geojson') }}-${{ github.run_id }}
          restore-keys: satsuivi-${{ hashFiles('cams.yaml', 'data/meleze_sentinel2.geojson') }}-
      - name: Suivi Sentinel-2 (nouveaux passages)
        # Une panne côté satellite ne doit pas empêcher la publication de la page.
        continue-on-error: true
        run: larch satsuivi
      - name: Page
        run: larch report
      - name: Sauvegarde de l'historique
        run: |
          git config user.name "larch-meteo"
          git config user.email "larch-meteo@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Relevé du $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
